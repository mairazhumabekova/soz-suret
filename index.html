<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>СөзСурет</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background:
        linear-gradient(
          180deg,
          #dff5ff 0%,
          #fff8dc 55%,
          #e9ffd9 100%
        );
      color: #27364b;
    }

    .page {
      max-width: 520px;
      margin: auto;
      padding: 30px 20px 50px;
      text-align: center;
    }

    .sky {
      font-size: 45px;
      margin-bottom: 5px;
    }

    .logo {
      background: white;
      border-radius: 30px;
      padding: 25px 18px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
    }

    h1 {
      margin: 5px 0;
      font-size: 42px;
      color: #6c4bd3;
    }

    .subtitle {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
      color: #475569;
      margin-top: 10px;
    }

    .target {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 14px;
      background: #fff4b8;
      border-radius: 20px;
      font-size: 14px;
    }

    .menu {
      display: grid;
      gap: 15px;
    }

    .button {
      display: flex;
      align-items: center;
      text-align: left;
      width: 100%;
      border: none;
      border-radius: 22px;
      padding: 17px 20px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 7px 15px rgba(0,0,0,0.09);
      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-3px);
    }

    .emoji {
      font-size: 31px;
      margin-right: 15px;
    }

    .learn {
      background: #fff1a8;
    }

    .find {
      background: #cfeeff;
    }

    .three-s {
      background: #e2d5ff;
    }

    .quiz {
      background: #d5f6c4;
    }

    .button small {
      display: block;
      margin-top: 4px;
      font-weight: normal;
      font-size: 13px;
      color: #536171;
    }

    .method {
      margin-top: 25px;
      padding: 18px;
      background: rgba(255,255,255,0.75);
      border-radius: 22px;
    }

    .method-title {
      font-weight: bold;
      color: #6c4bd3;
      margin-bottom: 10px;
    }

    .steps {
      font-weight: bold;
      line-height: 1.8;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #64748b;
    }

    .star {
      font-size: 22px;
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="sky">
      ☀️ ☁️ 🌈
    </div>

    <section class="logo">

      <div class="star">✨ 📖 ✨</div>

      <h1>СӨЗСУРЕТ</h1>

      <div class="subtitle">
        «Суретші бояумен,<br>
        ақын сөзбен сурет салады!»
      </div>

      <div class="target">
        👧🧒 Бастауыш сынып оқушыларына арналған
      </div>

    </section>

    <section class="menu">

      <button class="button learn">
        <span class="emoji">📖</span>
        <span>
          ҮЙРЕНЕМІН
          <small>Эпитет, теңеу, кейіптеуді үйрен</small>
        </span>
      </button>

      <button class="button find">
        <span class="emoji">🔎</span>
        <span>
          КӨРКЕМ СӨЗДІ ТАП
          <small>Сөйлемнен көркем сөздерді ізде</small>
        </span>
      </button>

      <button class="button three-s">
        <span class="emoji">✨</span>
        <span>
          3С — СӨЗДІ ТІРІЛТ
          <small>Сипатта • Салыстыр • Сөйлет</small>
        </span>
      </button>

      <button class="button quiz">
        <span class="emoji">🏆</span>
        <span>
          БІЛІМІҢДІ СЫНА
          <small>Тапсырмаларды орындап, жұлдыз жина</small>
        </span>
      </button>

    </section>

    <section class="method">

      <div class="method-title">
        ⭐ Біздің 3С әдісіміз
      </div>

      <div class="steps">
        🎨 СИПАТТА
        &nbsp;→&nbsp;
        🔍 САЛЫСТЫР
        &nbsp;→&nbsp;
        💬 СӨЙЛЕТ
      </div>

    </section>

    <div class="footer">
      Сөзді таны • Бейнені елестет • Өзің құрастыр
    </div>

  </main>

</body>
</html>
